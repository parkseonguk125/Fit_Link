name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build PostgreSQL image and start container
        run: docker compose up -d postgres

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            docker compose exec -T postgres pg_isready -U exercise -d exercise_log && exit 0
            sleep 2
          done
          exit 1

      - name: Setup database
        run: |
          npm run db:deploy
          npm run db:seed
        env:
          DATABASE_URL: postgresql://exercise:exercise@localhost:5432/exercise_log?schema=public

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://exercise:exercise@localhost:5432/exercise_log?schema=public
          AUTH_SECRET: ci-test-secret
          AUTH_URL: http://localhost:3000
          UPLOAD_DIR: ./uploads
          CI: true

      - name: Build app
        run: npm run build
        env:
          DATABASE_URL: postgresql://exercise:exercise@localhost:5432/exercise_log?schema=public
          AUTH_SECRET: ci-test-secret
          AUTH_URL: http://localhost:3000
          UPLOAD_DIR: ./uploads
