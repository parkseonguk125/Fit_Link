name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and start Docker stack
        run: docker compose up -d --build

      - name: Wait for web
        run: |
          for i in {1..60}; do
            curl -sf http://localhost:8082/login && exit 0
            sleep 3
          done
          exit 1

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests against Docker web
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://exercise:exercise@localhost:5433/exercise_log?schema=public
          AUTH_SECRET: ci-test-secret
          AUTH_URL: http://localhost:8082
          AUTH_EMAIL_DEV_EXPOSE: "true"
          UPLOAD_DIR: ./uploads
          PLAYWRIGHT_BASE_URL: http://localhost:8082
          CI: true
