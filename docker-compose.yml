name: fit_link

services:
  db:
    build:
      context: ./docker/postgres
    image: fit_link_db:local
    container_name: fit_link_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: exercise
      POSTGRES_PASSWORD: exercise
      POSTGRES_DB: exercise_log
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exercise -d exercise_log"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: fit_link_api:local
    container_name: fit_link_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://exercise:exercise@db:5432/exercise_log?schema=public
      AUTH_SECRET: docker-dev-secret-change-in-production
      AUTH_URL: http://localhost:8081
      UPLOAD_DIR: /app/uploads
      NODE_ENV: production
    volumes:
      - uploads_data:/app/uploads

  web:
    build:
      context: ./docker/web
    image: fit_link_web:local
    container_name: fit_link_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8081:80"

volumes:
  postgres_data:
  uploads_data:
