services:
  postgres:
    build:
      context: ./docker/postgres
    image: exercise_log_postgres:local
    container_name: exercise_log_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: exercise
      POSTGRES_PASSWORD: exercise
      POSTGRES_DB: exercise_log
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exercise -d exercise_log"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: exercise_log_app:local
    container_name: exercise_log_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://exercise:exercise@postgres:5432/exercise_log?schema=public
      AUTH_SECRET: docker-dev-secret-change-in-production
      AUTH_URL: http://localhost:3000
      UPLOAD_DIR: /app/uploads
      NODE_ENV: production
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
